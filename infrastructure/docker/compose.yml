name: forge-local

services:

  # ============================================================
  # PostgreSQL
  # ============================================================
  postgres:
    image: postgres:17.6
    container_name: forge-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: forge
      POSTGRES_USER: forge
      POSTGRES_PASSWORD: forge_local_password

    ports:
      - "127.0.0.1:55432:5432"

    volumes:
      - forge_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forge -d forge"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

    networks:
      - forge-network


  # ============================================================
  # Apache Kafka
  # ============================================================
  kafka:
    image: apache/kafka:4.3.1
    container_name: forge-kafka
    restart: unless-stopped

    environment:

      # -------------------------
      # KRaft
      # -------------------------
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      # -------------------------
      # Listeners
      # -------------------------
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092

      KAFKA_ADVERTISED_LISTENERS: >-
        PLAINTEXT://kafka:9092,
        EXTERNAL://localhost:29092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: >-
        CONTROLLER:PLAINTEXT,
        PLAINTEXT:PLAINTEXT,
        EXTERNAL:PLAINTEXT

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      # -------------------------
      # Single-node development
      # -------------------------
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      # -------------------------
      # Development retention
      # -------------------------
      KAFKA_LOG_RETENTION_HOURS: 168

    ports:
      - "29092:29092"

    volumes:
      - forge_kafka_data:/var/lib/kafka/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"
        ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

    networks:
      - forge-network


  # ============================================================
  # Kafka UI
  # ============================================================
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: forge-kafka-ui
    restart: unless-stopped

    depends_on:
      kafka:
        condition: service_healthy

    environment:
      KAFKA_CLUSTERS_0_NAME: forge-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092

    ports:
      - "8085:8080"

    networks:
      - forge-network


# ==============================================================
# Persistent Storage
# ==============================================================
volumes:

  forge_postgres_data:
    name: forge-postgres-data

  forge_kafka_data:
    name: forge-kafka-data


# ==============================================================
# Network
# ==============================================================
networks:

  forge-network:
    name: forge-network
    driver: bridge